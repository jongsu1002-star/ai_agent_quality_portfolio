<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>로그인 - AI Agent 품질관리·운영 모니터링 플랫폼</title>
  <style>
    :root {
      --surface-1: #fcfcfb;
      --text-primary: #0b0b0b;
      --text-secondary: #52514e;
      --text-muted: #898781;
      --gridline: #e1e0d9;
      --accent: #2a78d6;
      --status-critical: #d1453d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--surface-1); color: var(--text-primary);
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
    }
    .card {
      width: 100%; max-width: 360px; padding: 2rem; margin: 1rem;
      background: white; border-radius: 14px; box-shadow: 0 8px 24px rgba(37, 99, 235, 0.12);
    }
    h1 { font-size: 1.15rem; margin: 0 0 0.35rem; }
    p.sub { color: var(--text-secondary); font-size: 0.85rem; margin: 0 0 1.5rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 0.4rem; }
    input {
      width: 100%; padding: 0.6rem 0.7rem; border-radius: 8px; border: 1px solid var(--gridline);
      font-size: 0.95rem; margin-bottom: 1rem;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      width: 100%; padding: 0.65rem; border: none; border-radius: 8px; background: var(--accent);
      color: white; font-size: 0.95rem; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d5fb0; }
    button:disabled { background: var(--gridline); cursor: not-allowed; }
    #error { color: var(--status-critical); font-size: 0.85rem; margin: -0.5rem 0 1rem; display: none; }
    .signup-link { text-align: center; font-size: 0.85rem; color: var(--text-secondary); margin-top: 1rem; }
    .signup-link a { color: var(--accent); text-decoration: none; }
    .signup-link a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <h1>AI Agent 품질관리·운영 모니터링 플랫폼</h1>
    <p class="sub">아이디와 비밀번호를 입력하면 대시보드로 이동합니다.</p>
    <form id="login-form">
      <label for="username">아이디</label>
      <input id="username" type="text" autocomplete="username" autofocus />
      <label for="password">비밀번호</label>
      <input id="password" type="password" autocomplete="current-password" />
      <div id="error"></div>
      <button type="submit" id="submit-btn">로그인</button>
    </form>
    <p class="signup-link">계정이 없으신가요? <a href="/signup">회원가입</a></p>
  </div>
  <script>
    const NEXT = "__NEXT__";
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async (evt) => {
      evt.preventDefault();
      errorEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = '확인 중...';
      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        if (response.ok) {
          window.location.href = NEXT || '/';
          return;
        }
        const data = await response.json().catch(() => ({}));
        errorEl.textContent = data.error || '로그인에 실패했습니다.';
        errorEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = '서버에 연결할 수 없습니다.';
        errorEl.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = '로그인';
      }
    });
  </script>
</body>
</html>
